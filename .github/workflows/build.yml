name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Disable code signing so the build works on CI without Apple certificates.
      # The resulting .app is unsigned — it can be run locally after right-clicking
      # "Open" to bypass Gatekeeper. For notarized/App Store builds, see the
      # "Signed distribution" section in README.
      - name: Disable code signing for CI
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :com.apple.security.app-sandbox false" \
            macos/Runner/Release.entitlements
          ruby -e "
            f = 'macos/Runner.xcodeproj/project.pbxproj'
            c = File.read(f)
            c.gsub!(/CODE_SIGN_STYLE = Automatic;/, 'CODE_SIGN_STYLE = Manual;')
            c.gsub!(/DEVELOPMENT_TEAM = \S+;/, 'DEVELOPMENT_TEAM = \"\";')
            # Strip explicit CODE_SIGN_IDENTITY lines (e.g. 'Apple Development').
            # Without this, Manual signing + a named identity demands a provisioning
            # profile, which we don't have on CI.
            c.gsub!(/\"CODE_SIGN_IDENTITY\\[sdk=macosx\\*\\]\" = [^;]+;/, '\"CODE_SIGN_IDENTITY[sdk=macosx*]\" = \"-\";')
            c.gsub!(/CODE_SIGN_IDENTITY = [^;]+;/, 'CODE_SIGN_IDENTITY = \"-\";')
            File.write(f, c)
          "

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          mkdir -p exports/Runner
          cp -r build/macos/Build/Products/Release/popodoro.app exports/Runner/Popodoro.app
          npm install -g appdmg
          pip3 install pillow --break-system-packages || pip3 install pillow
          cd exports/dmg
          bash build.sh
          mv Popodoro.dmg $GITHUB_WORKSPACE/popodoro-macos.dmg

      - name: Sign macOS DMG for Auto Updater
        env:
          MACOS_PRIVATE_KEY: ${{ secrets.MAC_PRIVATE_KEY }}
        run: |
          echo "$MACOS_PRIVATE_KEY" | macos/Pods/Sparkle/bin/sign_update -f - -p popodoro-macos.dmg > mac_sig.txt
      - name: Sign Windows Installer for Auto Updater
        env:
          WINDOWS_PRIVATE_KEY: ${{ secrets.WINDOWS_PRIVATE_KEY }}
        shell: bash
        run: |
          INSTALLER=$(find build/windows/x64/installer -name "*.exe" | head -n 1)
          echo "$WINDOWS_PRIVATE_KEY" > dsa_priv.pem
          # WinSparkle requires sha1 dsa signature
          openssl dgst -sha1 -binary < "$INSTALLER" | openssl dgst -sha1 -sign "dsa_priv.pem" | openssl enc -base64 > win_sig.txt
          rm dsa_priv.pem

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: popodoro-macos
          path: |
            popodoro-macos.dmg
            mac_sig.txt
          retention-days: 14

  # ── Windows ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # inno_bundle references unofficial Inno Setup language files (e.g. Icelandic)
      # that are not included in the pre-installed copy on windows-latest runners.
      # Download them directly from the Inno Setup source repo.
      - name: Download missing Inno Setup language files
        shell: pwsh
        run: |
          $unofficialLangs = @(
            "Basque", "Belarusian", "Croatian", "Esperanto",
            "Galician", "Georgian", "Icelandic", "Macedonian",
            "Malay", "Maltese", "Punjabi", "Tamil", "Urdu", "Vietnamese"
          )
          $base = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial"
          $dest = "C:\Program Files (x86)\Inno Setup 6\Languages"
          foreach ($lang in $unofficialLangs) {
            try {
              Invoke-WebRequest -Uri "$base/$lang.isl" -OutFile "$dest\$lang.isl" -ErrorAction Stop
              Write-Host "✓ $lang.isl"
            } catch {
              Write-Host "⚠ $lang.isl not found upstream (skipping)"
            }
          }

      # inno_bundle drives flutter build windows internally, then wraps the
      # output into a self-contained Inno Setup installer (.exe).
      - name: Build Windows installer
        run: dart run inno_bundle --release

      - name: Find installer output
        shell: pwsh
        run: Get-ChildItem -Path build\windows\x64\installer -Recurse

      - name: Sign Windows Installer for Auto Updater
        env:
          WINDOWS_PRIVATE_KEY: ${{ secrets.WINDOWS_PRIVATE_KEY }}
        shell: bash
        run: |
          INSTALLER=$(find build/windows/x64/installer -name "*.exe" | head -n 1)
          echo "$WINDOWS_PRIVATE_KEY" > dsa_priv.pem
          # WinSparkle requires sha1 dsa signature
          openssl dgst -sha1 -binary < "$INSTALLER" | openssl dgst -sha1 -sign "dsa_priv.pem" | openssl enc -base64 > win_sig.txt
          rm dsa_priv.pem

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: popodoro-windows
          path: |
            build/windows/x64/installer/**/*.exe
            win_sig.txt
          retention-days: 14

  # ── GitHub Release (tag pushes only) ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: popodoro-macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: popodoro-windows

      - name: Rename Windows Installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          find . -name "*.exe" -exec mv {} "popodoro-${VERSION}-windows-installer.exe" \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            popodoro-macos.dmg
            popodoro-*-windows-installer.exe
          generate_release_notes: true

  # ── Deploy Appcast XML to GitHub Pages ───────────────────────────────────────
  deploy-pages:
    name: Deploy Appcast
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate XML
        run: |
          mkdir public
          VERSION="${GITHUB_REF_NAME#v}"
          
          MACOS_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/popodoro-macos.dmg"
          WINDOWS_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/popodoro-${VERSION}-windows-installer.exe"
          
          MAC_SIG=$(cat mac_sig.txt || echo "")
          WIN_SIG=$(cat win_sig.txt || echo "")
          
          # Use length=0 because auto_updater plugin doesn't strictly validate length, but sparkle requires it
          # Actually let's use the actual file size if possible, or 0.
          
          cat <<EOF > public/appcast.xml
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Popodoro Changelog</title>
              <item>
                <title>Version $VERSION</title>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <enclosure url="$MACOS_URL" sparkle:os="mac" type="application/octet-stream" sparkle:edSignature="$MAC_SIG" />
                <enclosure url="$WINDOWS_URL" sparkle:os="windows" type="application/octet-stream" sparkle:dsaSignature="$WIN_SIG" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
